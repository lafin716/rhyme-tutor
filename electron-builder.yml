appId: com.rhymetutor.app
productName: Rhyme Tutor
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
mac:
  target: [dir]
  category: public.app-category.education
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
